# Build with Nix in GitHub Actions, pulling from and pushing to a xilo cache.
# Copy to .github/workflows/ and set the XILO_TOKEN repo secret to a push
# token from the dashboard. The xilo action adds the cache as a substituter
# and pushes every path the job builds when the job ends.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: stubbedev/xilo@v2
        with:
          url: https://cache.example.com
          cache: myteam/mycache
          token: ${{ secrets.XILO_TOKEN }}
      - run: nix build
