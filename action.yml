name: xilo-nix-cache
description: Pull from a xilo binary cache, and push every path the job builds to it
branding:
  icon: package
  color: blue

inputs:
  url:
    description: xilo server base URL, e.g. https://cache.example.com
    required: true
  cache:
    description: Cache to pull from and push to, as account/cache
    required: true
  token:
    description: Push token (store it in a repo secret). Optional for pulling from a public cache.
    default: ""
  push:
    description: Push every store path the job builds, through a store watcher that the post step drains. auto pushes when a token is given; true or false force it.
    default: auto
  push-timeout-minutes:
    description: How long the post step waits for the watcher to finish pushing before failing the job.
    default: "60"
  version:
    description: xilo release to install, e.g. v2.0.0. Defaults to the latest release.
    default: latest

runs:
  using: node24
  main: action/main.mjs
  post: action/post.mjs
