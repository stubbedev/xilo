version: "2"

# Stdlib-first gate. Every linter here answers one question — "does Go already
# have this?" — so a finding is a real simplification, not a style opinion.
# Deliberately narrow: no formatting, naming or complexity linters, which would
# bury the signal. Almost everything here auto-fixes (`just lint-fix`).
linters:
  default: none
  enable:
    - copyloopvar   # the pre-1.22 `x := x` loop dance
    - errorlint     # == on wrapped errors, %v where %w belongs
    - exptostd      # golang.org/x/exp/... that has landed in the stdlib
    - govet
    - intrange      # for i := 0; i < n; i++  →  for i := range n
    - mirror        # the bytes/strings twin that avoids a conversion
    - modernize     # slices/maps/min/max/range-over-func/WaitGroup.Go/…
    - nilnesserr
    - perfsprint    # fmt.Sprintf where strconv or plain concatenation does
    - staticcheck
    - usestdlibvars # http.MethodGet, http.StatusOK, time.RFC3339, …
  settings:
    staticcheck:
      # golangci's defaults.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    # views/*_templ.go is generated by templ on every build and never edited.
    generated: lax
