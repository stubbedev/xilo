# air, live reload for `just dev` (scripts/dev.sh). Rebuilds on .go/.templ/.css
# change, regenerating templ views and the stylesheet first. No proxy: under
# XILO_DEV the page itself notices the restart and morphs in place. The server
# reads its config from XILO_CONFIG, exported by dev.sh.
root = "."
tmp_dir = "tmp"

[build]
cmd = "templ generate && just css && go build -o ./tmp/xilo ./cmd/xilo"
bin = "./tmp/xilo"
args_bin = ["serve"]
include_ext = ["go", "templ", "css"]
exclude_dir = ["tmp", "bin", "data", ".git", ".direnv", "tests", "docs"]
exclude_regex = ["_templ.go$", "_test.go", "xilo-tw.css$", "sources.generated.css$"]
stop_on_error = true
delay = 300

[misc]
clean_on_exit = false
