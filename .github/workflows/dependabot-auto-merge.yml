name: dependabot-auto-merge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --author "app/dependabot" --json number --jq '.[].number')
          [ -n "$prs" ] || { echo "No open dependabot PRs."; exit 0; }

          merged=0
          failed=()

          for pr in $prs; do
            buckets=$(gh pr checks "$pr" --json bucket --jq '[.[].bucket]|unique|join(",")' 2>/dev/null || echo "none")
            case "$buckets" in
              *fail*)     echo "#$pr: checks failing ($buckets) — leaving for a human"; continue ;;
              *pending*)  echo "#$pr: checks still running ($buckets)"; continue ;;
              *pass*)     ;;
              *)          echo "#$pr: no passing checks ($buckets) — refusing to merge blind"; continue ;;
            esac

            mergeable=$(gh pr view "$pr" --json mergeable --jq .mergeable)
            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "#$pr: not mergeable ($mergeable)"
              continue
            fi

            workflow_files=$(gh api "repos/$GH_REPO/pulls/$pr/files" --paginate --jq '.[].filename | select(startswith(".github/workflows/"))')
            if [ -n "$workflow_files" ]; then
              echo "::notice::#$pr modifies workflow files, which GITHUB_TOKEN may not merge; merge it manually: ${workflow_files//$'\n'/, }"
              continue
            fi

            if ! gh pr merge "$pr" --squash --delete-branch; then
              echo "::error::#$pr: merge failed"
              failed+=("$pr")
              continue
            fi
            echo "::notice::Auto-merged dependabot PR #$pr ($buckets)."
            merged=$((merged + 1))
          done

          if [ "$merged" -gt 0 ]; then
            gh workflow run ci.yml --ref "$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to merge: ${failed[*]/#/#}"
            exit 1
          fi
