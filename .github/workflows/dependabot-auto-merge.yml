name: dependabot-auto-merge

# Squash-merges dependabot PRs once every check on the head commit is green.
#
# Deliberately a schedule and not `workflow_run` / `pull_request_target`:
# dependabot PRs get a read-only GITHUB_TOKEN on `pull_request`, so nothing
# running in the PR's own context can merge them. A scheduled run executes in
# the default-branch context with a write token, so this needs no PAT, no
# ruleset, and no hardcoded list of CI workflow names.
#
# Whatever CI actually rejects stays open for a human — that is the point.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --author "app/dependabot" --json number --jq '.[].number')
          [ -n "$prs" ] || { echo "No open dependabot PRs."; exit 0; }

          for pr in $prs; do
            # `cancel-in-progress` concurrency leaves CANCELLED rows from
            # superseded attempts alongside the real ones, so judge by bucket and
            # ignore "cancel": a cancelled run always has a newer one behind it.
            buckets=$(gh pr checks "$pr" --json bucket --jq '[.[].bucket]|unique|join(",")' 2>/dev/null || echo "none")
            mergeable=$(gh pr view "$pr" --json mergeable --jq .mergeable)

            case "$buckets" in
              *fail*)     echo "#$pr: checks failing ($buckets) — leaving for a human"; continue ;;
              *pending*)  echo "#$pr: checks still running ($buckets)"; continue ;;
              *pass*)     ;;
              *)          echo "#$pr: no passing checks ($buckets) — refusing to merge blind"; continue ;;
            esac

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "#$pr: not mergeable ($mergeable)"
              continue
            fi

            gh pr merge "$pr" --squash --delete-branch
            echo "::notice::Auto-merged dependabot PR #$pr ($buckets)."
          done
