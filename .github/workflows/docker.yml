name: Docker

on:
  push:
    branches: [master, main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The release tarballs cover arm64, so the image has to as well — a Pi or
      # an Ampere VPS pulling `latest` was getting an amd64-only manifest. No
      # QEMU step: the Dockerfile cross-compiles from the build platform (see
      # its header), and the final stage only copies the binary in, so nothing
      # foreign is ever executed. riscv64 stays tarball-only — that build needs
      # the noserver tag, which is a different binary, not another platform.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
