name: vendor-hash

on:
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: read

jobs:
  vendor-hash:
    uses: stubbedev/lys-ci/.github/workflows/vendor-hash.yml@da3b6d13484c3cb7245cd58544216beb4d72ea08
    with:
      recipe: sync-vendor-hash
    secrets:
      VENDOR_HASH_DEPLOY_KEY: ${{ secrets.VENDOR_HASH_DEPLOY_KEY }}
