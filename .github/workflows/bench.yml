name: Bench

# Head-to-head against the other self-hostable Nix caches, measured by CI so
# the README's comparison is a number a machine produced and not a claim.
#
# Weekly rather than per push: the run takes twenty minutes, pulls four other
# implementations, and its numbers move with the runner's mood rather than with
# a commit. Two other things do trigger it, because both change what the
# published numbers mean: a change to the harness or the chart renderer (the
# measurement itself moved, so the measurement is retaken), and a published
# release (so the figures on the README describe the release).
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master, main]
    paths:
      - "tests/bench/**"
      - "tools/perfchart/**"
      - ".github/workflows/bench.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated targets (xilo,attic,harmonia,nixserve,s3,garage)
        default: xilo,attic,harmonia,nixserve,s3,garage

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: xilo vs attic, harmonia, nix-serve-ng, MinIO, Garage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Before setup-go, and never touching $AGENT_TOOLSDIRECTORY: that is
      # where setup-go puts the toolchain, and deleting it after the fact cost
      # a whole run. The bench skipped xilo with "go build failed" and measured
      # the other four, which is the one result this workflow must never
      # produce quietly.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: DeterminateSystems/nix-installer-action@v22

      # The bench builds xilo from this tree, and that build embeds two
      # generated artifacts: the Tailwind sheet (//go:embed static) and the
      # templ views. Without them the build fails on a broken embed and 40
      # undefined views, which the harness reports as "skipping xilo: go build
      # failed" -- a comparison of everything except its subject. Tailwind is
      # pinned for the same reason as everywhere else (v4.3+ latest went
      # dynamically linked).
      - name: build admin CSS
        run: |
          curl -sSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          ./scripts/build-css.sh
      - name: generate templ views
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate

      - name: run the comparison
        env:
          # Named so the chart's caption says what measured it. Runner specs
          # are public: 2 vCPU, 16 GB, and shared, which is why the absolute
          # numbers are only ever read against each other.
          BENCH_RUNNER: GitHub ubuntu-latest runner, 2 cores
        run: |
          ./tests/bench/bench.sh \
            --targets "${{ github.event.inputs.targets || 'xilo,attic,harmonia,nixserve,s3,garage' }}" \
            --json bench-results.json | tee bench.log

      - name: job summary
        if: always()
        run: |
          {
            echo '### Cross-implementation comparison'
            echo
            echo '```'
            sed -n '/^=====/,$p' bench.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            bench-results.json
            bench.log

      # A comparator that dropped out is the one thing a green run could hide,
      # since the chart shows an absence as a missing bar rather than a reason.
      # Another implementation failing to start is a warning; xilo failing to
      # start is the end of the run, because "xilo against the others" without
      # xilo is not a comparison and must never reach the README.
      - name: check every target ran
        if: always()
        run: |
          [ -f bench-results.json ] || { echo "::error::no results file"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("bench-results.json"))
          targets = d["targets"]
          missing = {t: v for t, v in targets.items() if v.get("status") != "ok"}
          for t, v in missing.items():
              level = "error" if t == "xilo" else "warning"
              print(f"::{level} title=bench target {t} did not run::{v.get('error', 'no status')}")
          print(f"{len(targets) - len(missing)} of {len(targets)} targets measured")
          sys.exit(1 if "xilo" in missing else 0)
          PY

      # Only the default branch owns the committed numbers: a tag run measures
      # and reports, but rewriting history's charts from a tag would put a
      # commit on a branch nobody asked to move.
      - name: commit results + charts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          cp bench-results.json tests/bench/results.json
          go run ./tools/perfchart
          if [ -z "$(git status --porcelain tests/bench/results.json docs/perf)" ]; then
            echo "numbers and charts already in sync"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/bench/results.json docs/perf
          git commit -m 'chore: refresh cross-implementation benchmark [skip ci]'
          # CI's own artifact commit can land between the checkout and this
          # push; rebasing beats failing a run that measured everything
          # correctly.
          git push || { git pull --rebase --autostash && git push; }
