name: Perf

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

# A second push to the same ref supersedes the first run: nobody reads the
# result of a commit that is no longer the head, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: k6 (${{ matrix.tenancy }}) ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Single-tenant: the classic numbers, tracked release over release.
          - { tenancy: single, suite: perf,     config: server-perf.yaml,     tenants: 0 }
          - { tenancy: single, suite: churn,    config: server-churn.yaml,    tenants: 0 }
          - { tenancy: single, suite: pressure, config: server-perf.yaml,     tenants: 0 }
          # Multi-tenant: same suites with load spread across registered
          # accounts, so per-account isolation is exercised under pressure.
          - { tenancy: multi,  suite: perf,     config: server-mt.yaml,       tenants: 4 }
          - { tenancy: multi,  suite: churn,    config: server-mt-churn.yaml, tenants: 4 }
          - { tenancy: multi,  suite: pressure, config: server-mt.yaml,       tenants: 4 }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      # One suite per runner: the three used to queue behind each other inside
      # one job, which set the workflow's wall at their sum (~17 minutes).
      # Parallel they cost only the slowest one. The image builds against the
      # GHA layer cache, so every run after the first is a download, not a
      # compile; compose finds this pre-built image and skips its own build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xilo-k6-xilo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner is dedicated to this one suite, so a regression fails the
      # job directly -- the old run-all-suites-then-verdict dance existed only
      # because the suites shared a job and a regression would have silenced
      # the ones behind it.
      - name: ${{ matrix.suite }} suite
        run: |
          EXTRA=""
          if [ "${{ matrix.suite }}" = pressure ]; then
            EXTRA="-e STORM_VUS=128 -e FLOOD_RPS=1200 -e PULL_VUS=32 -e DURATION_S=45"
          fi
          XILO_E2E_CONFIG=${{ matrix.config }} docker compose -f tests/k6/compose.yaml \
            run --rm $EXTRA -e TENANTS=${{ matrix.tenants }} \
            k6 run --summary-export=/out/summary.json /scripts/${{ matrix.suite }}.js
          docker compose -f tests/k6/compose.yaml run --rm --entrypoint cat k6 /out/summary.json > k6-${{ matrix.suite }}-summary.json

      - name: ${{ matrix.suite }} vs baseline
        run: ./tests/k6/compare.sh tests/k6/baselines/${{ matrix.suite }}.json k6-${{ matrix.suite }}-summary.json ${{ matrix.suite }}-${{ matrix.tenancy }}

      - name: job summary
        if: always()
        run: |
          f=k6-${{ matrix.suite }}-summary.json
          [ -f "$f" ] || exit 0
          echo "### ${{ matrix.suite }} (${{ matrix.tenancy }}-tenant)" >> "$GITHUB_STEP_SUMMARY"
          echo '| metric | p50 | p95 | p99 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.metrics | to_entries[]
            | select(.key | startswith("http_req_duration"))
            | "| \(.key) | \(.value["med"] // 0 | round)ms | \(.value["p(95)"] // 0 | round)ms | \(.value["p(99)"] // .value["p(95)"] // 0 | round)ms |"' \
            "$f" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"| http_reqs (count) | \(.metrics.http_reqs.count) | | |",
                 "| http_req_failed (rate) | \(.metrics.http_req_failed.value // 0) | | |"' \
            "$f" >> "$GITHUB_STEP_SUMMARY" || true
          # Per-scenario failure rates, because the aggregate answers "did
          # anything fail" and not "what failed": a rate on this page with
          # no scenario beside it sends you to the raw log to find out.
          jq -e '.metrics | any(keys[]; startswith("http_req_failed{"))' "$f" >/dev/null 2>&1 || exit 0
          echo '| scenario | failed |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.metrics | to_entries[]
            | select(.key | startswith("http_req_failed{"))
            | "| \(.key | ltrimstr("http_req_failed{") | rtrimstr("}")) | \(.value.value // 0) |"' \
            "$f" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-${{ matrix.suite }}-${{ matrix.tenancy }}-${{ github.ref_name }}-${{ github.run_number }}
          path: k6-${{ matrix.suite }}-summary.json

      - name: teardown
        if: always()
        run: docker compose -f tests/k6/compose.yaml down -v

  # One check that holds every suite's baseline, for whoever gates a merge or
  # a release on this workflow as a whole; the regressed suite names itself
  # in its own job's error above.
  verdict:
    name: baseline verdict
    needs: k6
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.k6.result }}" != success ]; then
            echo "::error::a k6 suite failed or regressed against its baseline; see the k6 job that failed"
            exit 1
          fi
          echo "all suites held their baselines"
