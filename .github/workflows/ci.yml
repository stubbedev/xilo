name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    env:
      # Declares that everything the suites need is installed here, so a
      # missing prerequisite fails instead of skipping (internal/testenv).
      # Without nix below, the NAR differential tests skipped silently and
      # the byte layout that every NarHash depends on went unverified.
      XILO_STRICT_TESTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # internal/nar and internal/push diff their own serialization against
      # `nix-store --dump`; those tests are the contract, not a nicety.
      - uses: DeterminateSystems/nix-installer-action@v22
      # Admin CSS is generated (not committed) and embedded via go:embed.
      - name: build admin CSS
        run: |
          curl -sSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          ./scripts/build-css.sh
      # *_templ.go is not committed — generate it (templ version from go.mod).
      - name: generate templ views
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # Stdlib-first gate (.golangci.yml) — the same set `just lint` runs.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - run: go build ./...
      # Client-only build (flake packages.xilo-cli): fails if anything outside
      # internal/cli/serve.go starts importing internal/server.
      - run: go build -tags noserver -o /dev/null ./cmd/xilo
      - run: go test -race ./...

  vuln:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Reachability-filtered: govulncheck traces call paths, so an advisory
      # in a function nothing calls does not fail the build. Anything it does
      # report is code this binary can actually run.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # A smoke run, not a campaign: 30s per target is enough to catch a
      # regression a seed corpus already covers, and the committed corpus in
      # testdata/fuzz replays every input a longer run ever found. Hunt for
      # new ones locally with `just fuzz <target> <duration>`.
      - name: fuzz
        run: |
          set -euo pipefail
          fail=0
          while read -r pkg target; do
            [ -n "$pkg" ] || continue
            echo "::group::$pkg $target"
            if ! go test "$pkg" -run "^$target$" -fuzz "^$target$" -fuzztime=30s -count=1; then
              fail=1
            fi
            echo "::endgroup::"
          done <<'TARGETS'
          ./internal/narinfo FuzzParseHash
          ./internal/narinfo FuzzNarHashIsCanonical
          ./internal/narinfo FuzzBase32RoundTrip
          ./internal/narinfo FuzzStorePathAccessors
          ./internal/chunk FuzzSplitReassembles
          ./internal/chunk FuzzSplitDeterministic
          ./internal/chunk FuzzSplitHashesMatchesSplit
          ./internal/config FuzzParseBytes
          ./internal/config FuzzLoad
          ./internal/nar FuzzDumpSingleFile
          ./internal/nar FuzzDumpDirectoryOrdering
          TARGETS
          exit $fail
      # A crasher is only useful if you can replay it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashers
          path: |
            internal/*/testdata/fuzz/**
            ~/.cache/go-build/fuzz/**

  postgres:
    name: store suite against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The whole suite, not one function: XILO_TEST_BACKEND points every
      # openTest caller at Postgres (each test in its own schema), so the same
      # ~83 bodies that cover SQLite in the test job cover Postgres here. It
      # used to be a single hand-written walk that had to be extended by hand
      # for every new store method, and usually wasn't.
      - name: run the store suite against postgres
        env:
          XILO_TEST_BACKEND: postgres
          XILO_PG_TEST_DSN: postgres://postgres:x@localhost:5432/postgres
        run: go test ./internal/store/ -count=1

  minio:
    name: S3 backend against MinIO
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: xilo-test
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Chunk bytes never touch the DB, so the blob backend is the only thing
      # between a cache and its content -- and the S3 path was only ever
      # exercised against a fake written to our own idea of the protocol.
      # XILO_REQUIRE_S3 turns a missing MinIO into a failure here, so this
      # job cannot go green by skipping.
      - name: run the S3 backend tests against MinIO
        env:
          XILO_S3_TEST_ENDPOINT: localhost:9000
          XILO_S3_TEST_BUCKET: xilo-test
          XILO_REQUIRE_S3: 1
        run: go test ./internal/storage/ -run RealS3 -count=1 -v

  e2e:
    name: CLI end-to-end (real nix + containerized server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build admin CSS
        run: |
          curl -sSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          ./scripts/build-css.sh
      - name: generate templ views
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate
      - name: run CLI e2e suite
        run: ./tests/e2e/cli.sh

  flake:
    name: nix flake builds (vendorHash in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # Fails if flake.nix vendorHash is stale after a go.mod/go.sum bump.
      - run: nix build .#default -L

  ops:
    name: k6 operations conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run ops suite (single-tenant)
        run: docker compose -f tests/k6/compose.yaml run --rm k6 run /scripts/ops.js
      # Fresh server per suite: ops ends with tokens in the DB (bootstrap
      # closed), which deep's anonymous pushes must not inherit.
      - name: run deep suite (edge dimensions)
        run: |
          docker compose -f tests/k6/compose.yaml down -v
          docker compose -f tests/k6/compose.yaml run --rm k6 run /scripts/deep.js
      - name: run mt suite (multi-tenant conformance)
        run: |
          docker compose -f tests/k6/compose.yaml down -v
          XILO_E2E_CONFIG=server-mt.yaml docker compose -f tests/k6/compose.yaml \
            run --rm k6 run /scripts/mt.js
      - name: teardown
        if: always()
        run: docker compose -f tests/k6/compose.yaml down -v

  schema:
    name: schema + coverage badge in sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Regenerate schemas/xilo.schema.json from the config.Config Go types
      # so a new/changed field always flows into editor hinting.
      - name: build admin CSS
        run: |
          curl -sSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          ./scripts/build-css.sh
      - name: regenerate schema
        run: |
          go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate
          mkdir -p schemas
          go run ./tools/schemagen --out schemas/xilo.schema.json

      # Coverage badge (shields.io endpoint JSON, served raw from master).
      # Generated *_templ.go views are excluded — the badge tracks the code
      # humans maintain.
      - name: regenerate coverage badge
        run: |
          # Keep the output: discarding it turns any test failure here into a
          # bare "exit code 1" with nothing to debug.
          if ! go test -count=1 -coverprofile=cover.out ./internal/... > test.log 2>&1; then
            echo "::error::tests failed while measuring coverage"
            tail -200 test.log
            exit 1
          fi
          grep -v "_templ.go:" cover.out > cover-filtered.out
          pct=$(go tool cover -func=cover-filtered.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          # A floor, not just a badge: the number was recorded and nothing
          # failed when it dropped. Raising it is welcome; lowering it should
          # be a deliberate commit that says why.
          floor=82.0
          if ! awk -v p="$pct" -v f="$floor" 'BEGIN{exit !(p+0 >= f+0)}'; then
            echo "::error::coverage ${pct}% is below the ${floor}% floor"
            exit 1
          fi
          echo "coverage ${pct}% (floor ${floor}%)"
          color=orange
          awk -v p="$pct" 'BEGIN{exit !(p>=70)}' && color=yellowgreen
          awk -v p="$pct" 'BEGIN{exit !(p>=80)}' && color=green
          awk -v p="$pct" 'BEGIN{exit !(p>=90)}' && color=brightgreen
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > .github/badges/coverage.json
          rm cover.out cover-filtered.out
          cat .github/badges/coverage.json

      # On PRs: fail if the schema is stale so the author regenerates + commits.
      - name: assert in sync (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain schemas/xilo.schema.json)" ]; then
            echo "::error::JSON schema is stale. Run 'just sync-schema' and commit."
            git --no-pager diff schemas/xilo.schema.json
            exit 1
          fi

      # On master/main pushes: auto-commit any drift (schema + badge).
      - name: auto-commit (push)
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain schemas/xilo.schema.json .github/badges/coverage.json)" ]; then
            echo "schema + badge already in sync"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/xilo.schema.json .github/badges/coverage.json
          git commit -m 'chore: auto-bump schema + coverage badge [skip ci]'
          git push
