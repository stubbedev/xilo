name: Nightly

# The suites too slow for a push but too valuable to run only by hand. Every
# one of these already existed as a justfile recipe that nothing ever invoked:
# a race-detector soak, a SIGKILL-mid-push corruption check, and a long fuzz
# campaign. A guarantee nobody runs is not a guarantee.
on:
  schedule:
    # 03:20 UTC, off the hour so it does not queue behind everyone's cron.
    - cron: "20 3 * * *"
  workflow_dispatch:

# A nightly that stacks up behind itself tells you nothing about last night.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  race-soak:
    name: churn soak against a -race server
    runs-on: ubuntu-latest
    # Most of this is the -race build itself: an empty module cache, templ
    # generate, then compiling the tree with the detector on, on two cores.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # compose's `race` profile runs the server under `go run -race` on a
      # glibc base, with hostile GC (server-churn.yaml) and concurrent dedup
      # pushes against it. The store's whole claim is that writes funnel
      # through one goroutine so SQLITE_BUSY cannot happen; this is the only
      # thing that would catch a second write path appearing.
      - name: race-built churn soak
        run: |
          docker compose -f tests/k6/compose.yaml --profile race run --rm k6-race
      - name: race report
        if: always()
        run: |
          # A detected race makes the server log it and exit non-zero; the
          # log is where the stack lives.
          docker compose -f tests/k6/compose.yaml --profile race logs xilo-race \
            | tail -400 || true
      - name: teardown
        if: always()
        run: docker compose -f tests/k6/compose.yaml --profile race down -v

  chaos:
    name: SIGKILL mid-push, restart, prove no corruption
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: build admin CSS
        run: |
          curl -sSL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64 -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          ./scripts/build-css.sh
      - name: generate templ views
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate
      # An interrupted push must leave the path absent rather than
      # half-registered, a re-push must complete, and every NAR pushed before
      # the kill must still reassemble byte-exact through `nix copy`. Runs
      # single-tenant then multi-tenant.
      - name: chaos suite
        run: ./tests/e2e/chaos.sh

  fuzz-campaign:
    name: fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # CI's per-push fuzz job runs 30s a target, which only replays what the
      # corpus already covers. This is the part that finds something new.
      - name: fuzz each target for 4 minutes
        run: |
          set -uo pipefail
          fail=0
          while read -r pkg target; do
            [ -n "$pkg" ] || continue
            echo "::group::$pkg $target"
            if ! go test "$pkg" -run "^$target$" -fuzz "^$target$" -fuzztime=4m -count=1; then
              fail=1
            fi
            echo "::endgroup::"
          done <<'TARGETS'
          ./internal/narinfo FuzzParseHash
          ./internal/narinfo FuzzNarHashIsCanonical
          ./internal/narinfo FuzzBase32RoundTrip
          ./internal/narinfo FuzzStorePathAccessors
          ./internal/chunk FuzzSplitReassembles
          ./internal/chunk FuzzSplitDeterministic
          ./internal/chunk FuzzSplitHashesMatchesSplit
          ./internal/config FuzzParseBytes
          ./internal/config FuzzLoad
          ./internal/nar FuzzDumpSingleFile
          ./internal/nar FuzzDumpDirectoryOrdering
          TARGETS
          exit $fail
      # A crasher found overnight is worth nothing if it is not reproducible:
      # the corpus entry is the bug report, and belongs in a commit.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-fuzz-crashers
          path: |
            internal/*/testdata/fuzz/**
            ~/.cache/go-build/fuzz/**
