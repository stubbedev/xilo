<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t"><title id="t">Bar charts of xilo&#39;s k6 performance gate: read latency, push round trip and requests served. The table below holds every number.</title><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><text x="0" y="15" fill="#cdd6f4" font-size="15" font-weight="600">Read latency, p95</text><text x="0" y="33" fill="#a6adc8" font-size="12.5">ms, lower is better</text><line x1="170" y1="42" x2="170" y2="260" stroke="#313244" stroke-width="1"/><text x="158" y="53" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">narinfo hit</text><path d="M170 46H183.2A3 3 0 0 1 186.2 49V57A3 3 0 0 1 183.2 60H170Z" fill="#7287fd"/><text x="194.2" y="53" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">8.4 ms</text><text x="158" y="81" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">narinfo miss</text><path d="M170 74H183.1A3 3 0 0 1 186.1 77V85A3 3 0 0 1 183.1 88H170Z" fill="#7287fd"/><text x="194.1" y="81" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">8.3 ms</text><text x="158" y="109" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">NAR pull</text><path d="M170 102H181A3 3 0 0 1 184 105V113A3 3 0 0 1 181 116H170Z" fill="#7287fd"/><text x="192" y="109" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">7.3 ms</text><text x="158" y="137" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">NAR pull, zstd</text><path d="M170 130H179.7A3 3 0 0 1 182.7 133V141A3 3 0 0 1 179.7 144H170Z" fill="#7287fd"/><text x="190.7" y="137" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">6.6 ms</text><text x="158" y="165" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">NAR pull, 64 MiB</text><path d="M170 158H354A3 3 0 0 1 357 161V169A3 3 0 0 1 354 172H170Z" fill="#7287fd"/><text x="365" y="165" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">97 ms</text><text x="158" y="193" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">narinfo under push load</text><path d="M170 186H239.6A3 3 0 0 1 242.6 189V197A3 3 0 0 1 239.6 200H170Z" fill="#7287fd"/><text x="250.6" y="193" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">38 ms</text><text x="158" y="221" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">narinfo, 512 clients</text><path d="M170 214H280.1A3 3 0 0 1 283.1 217V225A3 3 0 0 1 280.1 228H170Z" fill="#7287fd"/><text x="291.1" y="221" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">59 ms</text><text x="158" y="249" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">narinfo, 5000 rps arrival</text><path d="M170 242H170A3 3 0 0 1 173 245V253A3 3 0 0 1 170 256H170Z" fill="#7287fd"/><text x="181" y="249" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">0.8 ms</text><text x="464" y="15" fill="#cdd6f4" font-size="15" font-weight="600">Push round trip, p95</text><text x="464" y="33" fill="#a6adc8" font-size="12.5">ms, lower is better</text><line x1="634" y1="42" x2="634" y2="92" stroke="#313244" stroke-width="1"/><text x="622" y="53" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">repeat push (deduped)</text><path d="M634 46H814.5A3 3 0 0 1 817.5 49V57A3 3 0 0 1 814.5 60H634Z" fill="#7287fd"/><text x="825.5" y="53" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">1.52 s</text><text x="622" y="81" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">fresh push</text><path d="M634 74H818A3 3 0 0 1 821 77V85A3 3 0 0 1 818 88H634Z" fill="#7287fd"/><text x="829" y="81" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">1.55 s</text><text x="0" y="313" fill="#cdd6f4" font-size="15" font-weight="600">Requests served per run</text><text x="0" y="331" fill="#a6adc8" font-size="12.5">requests, higher is better</text><line x1="170" y1="340" x2="170" y2="390" stroke="#313244" stroke-width="1"/><text x="158" y="351" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">throughput suite</text><path d="M170 344H338A3 3 0 0 1 341 347V355A3 3 0 0 1 338 358H170Z" fill="#7287fd"/><text x="349" y="351" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">357,331</text><text x="158" y="379" fill="#cdd6f4" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="central">pressure suite</text><path d="M170 372H354A3 3 0 0 1 357 375V383A3 3 0 0 1 354 386H170Z" fill="#7287fd"/><text x="365" y="379" fill="#cdd6f4" font-size="12.5" dominant-baseline="central" style="font-variant-numeric:tabular-nums">390,705</text></g></svg>
